# ==============================================================================
# BAOBAB Enterprise Platform
# Development Container Version Manifest
#
# File: config/versions.yaml
#
# Purpose
# -------
# Single source of truth for all software versions installed by the BAOBAB
# Development Container.
#
# Notes
# -----
# • Edit only this file when upgrading software.
# • resolve.sh reads this file and generates versions.lock.
# • The Dockerfile consumes versions.lock.
# ==============================================================================

manifest:
  schema: "1.0"
  name: "BAOBAB Development Container"
  description: "Version manifest for the BAOBAB DevContainer"

platform:
  ubuntu:
    version: "26.04"

languages:

  python:
    version: "3.14.6"
    source: "python.org"

  node:
    major: "24"
    source: "nodesource"

  flutter:
    version: "latest"
    channel: "stable"
    source: "flutter"

database:

  postgresql:
    major: "17"
    source: "apt"

  redis:
    # Client tools only (redis-cli via the redis-tools package) — no
    # server daemon ships in this image. No specific version to pin: the
    # Dockerfile installs whatever Ubuntu's own default archive currently
    # has (installed in the same apt-get invocation as postgresql-client,
    # but from Ubuntu's own repo, not apt.postgresql.org) — same pattern
    # as jq/fzf/tree/unzip/zip/xz below.
    version: "system"
    source: "apt"

package_managers:

  uv:
    version: "latest"
    source: "github"

  poetry:
    version: "latest"
    # Pure-Python package, no architecture-specific GitHub release binary —
    # installed via pipx pinned to this exact resolved version, verified by
    # pip's own install-time hash check against PyPI. See config/resolve.sh
    # for the full rationale (same reasoning as pnpm's source: npm, below).
    source: "pypi"

  pnpm:
    version: "latest"
    source: "npm"

utilities:

  task:
    version: "latest"
    source: "github"

  ripgrep:
    version: "latest"
    source: "github"

  fd:
    version: "latest"
    source: "github"

  bat:
    version: "latest"
    source: "github"

  eza:
    version: "latest"
    source: "github"

  jq:
    version: "system"
    source: "apt"

  yq:
    version: "latest"
    source: "github"

  fzf:
    version: "system"
    source: "apt"

  tree:
    version: "system"
    source: "apt"

  unzip:
    version: "system"
    source: "apt"

  zip:
    version: "system"
    source: "apt"

  xz:
    version: "system"
    source: "apt"

development:

  docker:
    version: "latest"
    source: "docker"

  github_cli:
    version: "latest"
    source: "github"

security:

  cosign:
    version: "latest"
    source: "github"