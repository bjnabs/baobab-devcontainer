name: Build and Publish BAOBAB Dev Container

# Triggers:
#   - Push of a semver tag (v1.2.3 / v1.2.3-rc.1) -> builds, verifies, and
#     publishes a versioned + floating-tag image to GHCR.
#   - Push to main that touches image sources -> builds + verifies only
#     (no publish) as a merge-gate / early warning signal.
#   - Manual dispatch -> for rebuilding an existing tag (e.g. after a base
#     image CVE patch) without cutting a new version.
on:
  push:
    branches: [main]
    tags: ["v*.*.*", "v*.*.*-*"]
    paths:
      - "Dockerfile"
      - "config/**"
      - "scripts/**"
      - ".devcontainer/**"
      - ".github/workflows/build-and-publish.yml"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "config/**"
      - "scripts/**"
      - ".devcontainer/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild (e.g. v1.2.3). Leave empty to build from the current ref."
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/baobab-devcontainer

permissions:
  contents: read
  packages: write
  id-token: write   # for keyless image signing with cosign

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    outputs:
      digest-amd64: ${{ steps.export-digest.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.export-digest.outputs.digest-arm64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute platform tag suffix
        id: platform
        run: echo "suffix=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Build (and push if not a PR) single-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${{ steps.platform.outputs.suffix }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        id: export-digest
        if: github.event_name != 'pull_request'
        run: |
          key=$(echo "${{ matrix.platform }}" | tr '/' '-')
          echo "digest-${key##*-}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Smoke-test image (single arch, native runner only)
        if: matrix.platform == 'linux/amd64'
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${{ steps.platform.outputs.suffix }} \
            baobab-verify

  merge-manifest-and-tag:
    name: Merge multi-arch manifest & tag semver
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------
      # Versioning strategy (see README.md § Versioning for full policy):
      #   - Tag pushes (vX.Y.Z[-rc.N]) are authoritative releases and get:
      #       X.Y.Z, X.Y, X, latest (latest only for non-prerelease tags)
      #   - Plain `main` branch builds get a `main` and `sha-<short>` tag
      #     but are NOT promoted to `latest`.
      # -----------------------------------------------------------------
      - name: Docker meta (compute tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') && startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Create and push multi-arch manifest
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/${IMAGE_NAME}"
          docker buildx imagetools create \
            $(printf ' --tag %s' ${{ steps.meta.outputs.tags }}) \
            "${IMG}@${{ needs.build.outputs.digest-amd64 }}" \
            "${IMG}@${{ needs.build.outputs.digest-arm64 }}"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign published tags (keyless / OIDC)
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/${IMAGE_NAME}"
          for tag in ${{ steps.meta.outputs.tags }}; do
            cosign sign --yes "${tag#*=}" 2>/dev/null || cosign sign --yes "${IMG}:$(echo "$tag" | sed 's#.*:##')"
          done

      - name: Generate GHCR release summary
        run: |
          {
            echo "## Published image"
            echo ""
            echo "\`\`\`"
            echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
