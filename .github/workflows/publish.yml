name: Publish BAOBAB Dev Container

# ----------------------------------------------------------------------
# .github/workflows/publish.yml 
# Triggers
#
# - Push of a semantic version tag (v1.2.3 / v1.2.3-rc.1)
#     -> Build, verify and publish to GHCR
#
# - Push to main affecting the dev container
#     -> Build and verify only (no release promotion)
#
# - Pull Requests
#     -> Build only
#
# - Manual Dispatch
#     -> Rebuild an existing release
# ----------------------------------------------------------------------

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
    paths:
      - ".devcontainer/**"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/publish.yml"

  pull_request:
    branches:
      - main
    paths:
      - ".devcontainer/**"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/publish.yml"

  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild (optional)
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/baobab-dev

permissions:
  contents: read
  packages: write
  id-token: write

jobs:

  #
  # Resolve tool versions
  #
  # config/versions.lock is a generated file — it is intentionally NOT
  # committed to the repository and the Dockerfile never runs resolve.sh
  # itself (version resolution always happens outside Docker). This job is
  # the single place that runs config/resolve.sh, and its output is shared
  # with every platform in the build matrix via an artifact so that
  # linux/amd64 and linux/arm64 are guaranteed to be built from the exact
  # same pinned versions — resolving independently per matrix leg could
  # otherwise race against upstream "latest" releases changing mid-run and
  # silently produce two images with mismatched toolchains.
  #
  resolve:

    name: Resolve tool versions

    runs-on: ubuntu-26.04

    steps:

      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Run config/resolve.sh
        env:
          # Authenticates resolve.sh's GitHub API lookups (task, ripgrep,
          # fd, bat, eza, yq, gh, cosign), raising the rate limit from
          # 60 req/hr (unauthenticated) to 5000 req/hr.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x config/resolve.sh
          ./config/resolve.sh
          # Fail fast here, with a clear message, rather than deep inside
          # the Docker build with a cryptic "file not found".
          test -s config/versions.lock

      - name: Upload versions.lock
        uses: actions/upload-artifact@v4
        with:
          name: versions-lock
          path: config/versions.lock
          retention-days: 1
          if-no-files-found: error

  build:

    name: Build (${{ matrix.platform }})

    needs: resolve

    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}

    strategy:
      fail-fast: false

      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    outputs:
      digest-amd64: ${{ steps.export-digest.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.export-digest.outputs.digest-arm64 }}

    steps:

      - uses: actions/checkout@v4

      - name: Download versions.lock
        uses: actions/download-artifact@v4
        with:
          name: versions-lock
          path: config

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute platform suffix
        id: platform
        run: |
          echo "suffix=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      #
      # Docker metadata
      #

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      #
      # Build image (Pure Digest Merge Pattern)
      #
      # Builds each architecture independently and pushes its raw layer blobs and manifest digest
      # directly to GHCR without human-readable tags.
      #
      - name: Build image
        id: build

        uses: docker/build-push-action@v6

        with:
          context: .
          file: ./.devcontainer/docker/Dockerfile
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}

          platforms: ${{ matrix.platform }}

          labels: ${{ steps.meta.outputs.labels }}

          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

          cache-from: type=gha,scope=${{ matrix.platform }}

          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        id: export-digest
        if: github.event_name != 'pull_request'
        run: |
          key=$(echo "${{ matrix.platform }}" | tr '/' '-')
          echo "digest-${key##*-}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      #
      # Smoke Test
      #
      - name: Smoke Test
        if: matrix.platform == 'linux/amd64' && github.event_name != 'pull_request'
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }} \
            baobab-verify

  publish:

    name: Publish Multi-Architecture Image

    needs: build

    if: github.event_name != 'pull_request'

    runs-on: ubuntu-24.04

    steps:

      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      #
      # Compute image tags
      #

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') && startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      #
      # Merge manifests & capture multi-arch digest
      #
      # Safely parses multiline tags from environment variables into a Bash array (`TAG_ARGS`)
      # to prevent multiline command inline substitution syntax errors.
      #
      - name: Publish multi-architecture manifest
        id: create-manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          IMG="${REGISTRY}/${IMAGE_NAME}"

          # Construct array of --tag arguments from multiline TAGS variable safely
          TAG_ARGS=()
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] && TAG_ARGS+=(--tag "${tag}")
          done <<< "${TAGS}"

          # Create and tag multi-architecture manifest list in GHCR
          docker buildx imagetools create \
            "${TAG_ARGS[@]}" \
            "${IMG}@${{ needs.build.outputs.digest-amd64 }}" \
            "${IMG}@${{ needs.build.outputs.digest-arm64 }}"

          # Extract canonical digest of the multi-architecture manifest
          FIRST_TAG=$(echo "${TAGS}" | head -n1)
          DIGEST=$(docker buildx imagetools inspect "${FIRST_TAG}" --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      #
      # Install Cosign
      #

      - uses: sigstore/cosign-installer@v3

      #
      # Sign multi-architecture image
      #
      - name: Sign multi-architecture image
        run: |
          set -euo pipefail

          IMG="${REGISTRY}/${IMAGE_NAME}"

          cosign sign --yes \
            -a "repo=${{ github.repository }}" \
            -a "workflow=${{ github.workflow }}" \
            -a "sha=${{ github.sha }}" \
            "${IMG}@${{ steps.create-manifest.outputs.digest }}"

      #
      # Workflow Summary
      #

      - name: Publish Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## BAOBAB Dev Container"
            echo ""
            echo "**Registry**"
            echo "\`ghcr.io/nabhold/baobab-dev\`"
            echo ""
            echo "**Published Tags**"
            echo '```'
            echo "${TAGS}"
            echo '```'
            echo ""
            echo "**Multi-Arch Manifest Digest**"
            echo "\`${{ steps.create-manifest.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"