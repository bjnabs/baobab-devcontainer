name: Publish BAOBAB Dev Container

# ----------------------------------------------------------------------
# Triggers
#
# - Push of a semantic version tag (v1.2.3 / v1.2.3-rc.1)
#     -> Build, verify and publish to GHCR
#
# - Push to main affecting the dev container
#     -> Build and verify only (no release promotion)
#
# - Pull Requests
#     -> Build only
#
# - Manual Dispatch
#     -> Rebuild an existing release
# ----------------------------------------------------------------------

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
    paths:
      - ".devcontainer/**"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/publish.yml"

  pull_request:
    branches:
      - main
    paths:
      - ".devcontainer/**"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/publish.yml"

  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild (optional)
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/baobab-dev

permissions:
  contents: read
  packages: write
  id-token: write

jobs:

  build:

    name: Build (${{ matrix.platform }})

    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}

    strategy:
      fail-fast: false

      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    outputs:
      digest-amd64: ${{ steps.export-digest.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.export-digest.outputs.digest-arm64 }}

    steps:

      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute platform suffix
        id: platform
        run: |
          echo "suffix=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      #
      # Docker metadata
      #

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      #
      # Build image
      #

      - name: Build image
        id: build

        uses: docker/build-push-action@v6

        with:
          context: .
          file: ./.devcontainer/docker/Dockerfile
          build-args: |
             BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
             VERSION=${{ steps.meta.outputs.version }}
             REVISION=${{ github.sha }}

          platforms: ${{ matrix.platform }}

          push: ${{ github.event_name != 'pull_request' }}

          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${{ steps.platform.outputs.suffix }}

          labels: ${{ steps.meta.outputs.labels }}

          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

          cache-from: type=gha,scope=${{ matrix.platform }}

          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest

        id: export-digest

        if: github.event_name != 'pull_request'

        run: |
          key=$(echo "${{ matrix.platform }}" | tr '/' '-')
          echo "digest-${key##*-}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      #
      # Smoke Test
      #

      - name: Smoke Test
        if: matrix.platform == 'linux/amd64'

        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${{ steps.platform.outputs.suffix }} \
            baobab-verify

  publish:

    name: Publish Multi-Architecture Image

    needs: build

    if: github.event_name != 'pull_request'

    runs-on: ubuntu-24.04

    steps:

      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      #
      # Compute image tags
      #

      - name: Docker metadata

        id: meta

        uses: docker/metadata-action@v5

        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

          tags: |

            type=semver,pattern={{version}}

            type=semver,pattern={{major}}.{{minor}}

            type=semver,pattern={{major}}

            type=raw,value=latest,enable=${{ !contains(github.ref, '-') && startsWith(github.ref, 'refs/tags/v') }}

            type=ref,event=branch

            type=sha,prefix=sha-,format=short

      #
      # Merge manifests
      #

      - name: Publish multi-architecture manifest

        run: |

          set -euo pipefail

          IMG="${REGISTRY}/${IMAGE_NAME}"

          docker buildx imagetools create \
            $(printf ' --tag %s' ${{ steps.meta.outputs.tags }}) \
            "${IMG}@${{ needs.build.outputs.digest-amd64 }}" \
            "${IMG}@${{ needs.build.outputs.digest-arm64 }}"

      #
      # Install Cosign
      #

      - uses: sigstore/cosign-installer@v3

      #
      # Sign images
      #

      - name: Sign images

        run: |

          set -euo pipefail

          IMG="${REGISTRY}/${IMAGE_NAME}"

          for tag in ${{ steps.meta.outputs.tags }}; do
            cosign sign --yes "${tag#*=}" \
            || cosign sign --yes "${IMG}:$(echo "$tag" | sed 's#.*:##')"
          done

      #
      # Workflow Summary
      #

      - name: Publish Summary

        run: |

          {
            echo "## BAOBAB Dev Container"

            echo ""

            echo "**Registry**"

            echo "\`ghcr.io/nabhold/baobab-dev\`"

            echo ""

            echo "**Published Tags**"

            echo '```'

            echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'

            echo '```'

          } >> "$GITHUB_STEP_SUMMARY"
