# ==============================================================================
# GitHub Actions Workflow
# ==============================================================================
# Workflow : Deploy Documentation
#
# Purpose
# -------
# Builds the BAOBAB documentation using MkDocs and deploys the generated
# static site to GitHub Pages.
#
# This workflow is intentionally limited to documentation deployment and does
# not build or publish the development container image.
#
# Trigger Conditions
# ------------------
# • Pushes to the main branch affecting documentation -> build AND deploy.
# • Pull requests affecting documentation -> build only, for validation.
#   Mirrors the build-on-PR / publish-on-push pattern already used by
#   .github/workflows/publish.yml for the container image.
# • Manual execution from the GitHub Actions UI -> build AND deploy.
#
# Documentation Source
# --------------------
# docs/
#
# Output
# ------
# GitHub Pages
#
# ==============================================================================

name: Deploy Documentation

on:
  push:
    branches:
      - main

    paths:
      # Documentation
      - "docs/**"

      # Site configuration
      - "mkdocs.yml"

      # Python dependencies
      - "pyproject.toml"
      - "uv.lock"

      # Workflow updates
      - ".github/workflows/pages.yml"

  pull_request:
    branches:
      - main

    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"

  workflow_dispatch:

# ------------------------------------------------------------------------------
# Required permissions
#
# Minimal by default (contents: read only). The elevated pages/id-token
# permissions needed to actually publish are granted only on the `deploy`
# job below, not workflow-wide — a pull_request build never needs them, so
# it never has them.
# ------------------------------------------------------------------------------
permissions:
  contents: read

# ------------------------------------------------------------------------------
# Prevent multiple documentation deployments running simultaneously.
#
# Scoped per-ref rather than a single shared key: a pull_request build and a
# main-branch deploy must never be able to cancel one another. Concurrent
# pushes to the same ref (e.g. two rapid pushes to main, or repeated pushes
# to the same PR branch) still cancel their own earlier, now-stale run.
# ------------------------------------------------------------------------------
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ------------------------------------------------------------------------
  # Build job
  #
  # Runs for every trigger (push, pull_request, workflow_dispatch). Only
  # builds and uploads the Pages artifact — never deploys. Needs no
  # permissions beyond the workflow-wide default (contents: read).
  # ------------------------------------------------------------------------
  build:
    name: Build Documentation

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------------------
      # Checkout repository
      #
      # fetch-depth: 0 (full history) is required by the
      # mkdocs-git-revision-date-localized-plugin to compute accurate
      # per-page "last updated" dates. Without it, every page silently
      # falls back to the build date instead (fallback_to_build_date: true
      # in mkdocs.yml prevents a hard failure, but every page would show
      # today's date rather than its real last-modified date).
      # ------------------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------------
      # Derive .python-version from config/versions.yaml
      #
      # config/versions.yaml is the single source of truth for the Python
      # version this whole project is pinned to (the same version the
      # container itself ships). This workflow doesn't need the rest of
      # what config/resolve.sh resolves (Flutter, GitHub CLI tool releases,
      # etc.) — none of that affects a documentation build, and pulling in
      # resolve.sh's other network calls here would only add unrelated
      # ways for this workflow to fail. This step reads just the one value
      # it actually needs directly, so uv pins the exact same Python
      # version a local contributor running config/resolve.sh would get.
      # ------------------------------------------------------------------------
      - name: Derive .python-version from config/versions.yaml
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          PYTHON_VERSION=$(yq -r '.languages.python.version' config/versions.yaml)
          echo "${PYTHON_VERSION%.*}" > .python-version
          cat .python-version

      # ------------------------------------------------------------------------
      # Install uv
      #
      # No separate actions/setup-python step: uv provisions the exact
      # Python version required by pyproject.toml's requires-python /
      # .python-version itself, so there's nothing to keep in sync by hand
      # here and no risk of the two drifting apart.
      #
      # enable-cache: true actually turns on uv's GitHub Actions cache
      # integration — this is opt-in, not automatic, despite what this
      # step used to claim in a comment here.
      # ------------------------------------------------------------------------
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # ------------------------------------------------------------------------
      # Install project dependencies (docs group only)
      # ------------------------------------------------------------------------
      - name: Synchronize project dependencies
        run: |
          uv sync --locked --group docs

      # ------------------------------------------------------------------------
      # Build documentation
      #
      # --strict
      #     Treat warnings as errors.
      #
      # --verbose
      #     Produce detailed logs to simplify troubleshooting.
      # ------------------------------------------------------------------------
      - name: Build documentation
        run: |
          uv run mkdocs build \
            --strict \
            --verbose

      # ------------------------------------------------------------------------
      # Upload generated static site
      #
      # Uploaded on every trigger, including pull_request — this only
      # packages the artifact for the deploy job (or for manual download/
      # preview) and does not publish anything on its own.
      # ------------------------------------------------------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  # ------------------------------------------------------------------------
  # Deploy job
  #
  # Only runs for pushes to main and manual dispatch — never for
  # pull_request builds. This is the only job in the workflow granted the
  # elevated pages/id-token permissions actual publishing requires.
  # ------------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages

    needs: build

    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:

      # ------------------------------------------------------------------------
      # Configure GitHub Pages
      # ------------------------------------------------------------------------
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # ------------------------------------------------------------------------
      # Deploy
      # ------------------------------------------------------------------------
      - name: Deploy documentation
        id: deploy
        uses: actions/deploy-pages@v4