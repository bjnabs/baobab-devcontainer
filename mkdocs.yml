# ==============================================================================
# BAOBAB Development Container
# ==============================================================================
#
# File
# ----
# mkdocs.yml
#
# Purpose
# -------
# Configures the BAOBAB Development Container documentation site.
#
# Documentation is authored in Markdown under the 'docs/' directory and is
# rendered into a static website using MkDocs with the Material theme.
#
# The generated site is automatically deployed to GitHub Pages through the
# GitHub Actions workflow located at:
#
#     .github/workflows/pages.yml
#
# Documentation Source
# --------------------
# docs/
#
# Generated Site
# --------------
# site/
#
# Landing Page
# ------------
# docs/index.md opts into a distinct, non-documentation rendering via its
# own front matter:
#
#     template: home.html
#     hide:
#       - navigation
#       - toc
#       - footer
#       - feedback
#
# `template: home.html` is resolved against overrides/home.html (see
# theme.custom_dir below), which extends Material's own main.html and
# overrides only the `tabs` block (suppresses the horizontal nav-tabs bar
# on this page) — the default `content` block is deliberately left alone,
# since it's what applies Material's `md-typeset` class that every rule in
# typography.css/components.css depends on. Every other page keeps
# Material's standard documentation chrome (left nav, right TOC, tab bar,
# breadcrumbs, feedback widget) untouched. See overrides/home.html for the
# full rationale.
#
# References
# ----------
# MkDocs
# https://www.mkdocs.org/
#
# Material for MkDocs
# https://squidfunk.github.io/mkdocs-material/
#
# GitHub Pages
# https://docs.github.com/pages
#
# ==============================================================================

# ------------------------------------------------------------------------------
# Documentation Directories
# ------------------------------------------------------------------------------

docs_dir: docs
site_dir: site

# ------------------------------------------------------------------------------
# Build Validation
# ------------------------------------------------------------------------------

strict: true

# ------------------------------------------------------------------------------
# Build Hooks
#
# Plain MkDocs core functionality (config.hooks, MkDocs 1.4+) — a Python
# module executed against build-time config/env hooks. Not a plugin, no
# extra dependency.
#
# hooks/copyright.py
#     Resolves the `{year}` placeholder in the `copyright` string below
#     with the current UTC year, so the footer's copyright notice never
#     needs a manual annual edit.
# ------------------------------------------------------------------------------

hooks:
  - hooks/copyright.py

# ------------------------------------------------------------------------------
# Live Reload
# ------------------------------------------------------------------------------

watch:
  - docs
  - mkdocs.yml
  - overrides
  - hooks

# ------------------------------------------------------------------------------
# Excluded Documentation
#
# Reserved for future documentation development.
# ------------------------------------------------------------------------------

exclude_docs: |
  drafts/
  templates/
  snippets/

# ------------------------------------------------------------------------------
# Site Information
# ------------------------------------------------------------------------------

site_name: BAOBAB

site_description: >
  Enterprise-grade, reproducible development environment for the
  BAOBAB Enterprise Platform.

site_author: Nabhold Group Africa

site_url: https://nabhold.github.io/baobab-dev/

repo_name: nabhold/baobab-dev

repo_url: https://github.com/nabhold/baobab-dev

edit_uri: edit/main/docs/

# `{year}` is resolved at build time by hooks/copyright.py — do not
# hand-edit the year here.
copyright: >-
  Copyright &copy; {year} Nabhold Group Africa | 
  Licensed under the Apache 2.0. License 

# ------------------------------------------------------------------------------
# Theme
# ------------------------------------------------------------------------------

theme:
  name: material

  language: en

  # Enables theme extension: MkDocs looks in this directory FIRST for any
  # template file before falling back to Material's own built-in templates.
  # This is how docs/index.md's `template: home.html` front matter resolves
  # to overrides/home.html without forking the theme. Required for the
  # landing page's distinct rendering — do not remove.
  custom_dir: overrides

  logo: assets/images/logo.png

  favicon: assets/images/favicon.png

  icon:
    # Icon shown next to the repository link in the header. Unset, Material
    # falls back to a generic Git icon rather than the GitHub mark.
    repo: fontawesome/brands/github

  features:

    # Navigation
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.instant.preview
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking

    # Table of Contents
    - toc.follow

    # Search
    - search.highlight
    - search.share
    - search.suggest

    # Content
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.tooltips

  palette:

    # Light Mode — applied when the OS reports a light preference, or as
    # the fallback when no preference is reported at all.
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      scheme: default 
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    # Dark Mode — applied when the OS reports a dark preference.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate 
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# ------------------------------------------------------------------------------
# Markdown Extensions
# ------------------------------------------------------------------------------

markdown_extensions:

  - abbr
  - admonition
  - attr_list
  
  - def_list
  - footnotes
  - md_in_html

  - tables

  - toc:
      permalink: true
      permalink_title: Anchor link to this section for reference
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
      title: On this page
      toc_depth: 3
  
  - pymdownx.betterem
  - pymdownx.blocks.caption
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg


  
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      use_pygments: true
      linenums_style: pymdownx-inline
      auto_title: true
      pygments_lang_class: true

  - pymdownx.inlinehilite
  - pymdownx.keys

  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

  - pymdownx.tasklist:
      custom_checkbox: true
  
  - pymdownx.tilde
  
# ------------------------------------------------------------------------------
# Plugins
# ------------------------------------------------------------------------------

plugins:

  - search:
      lang: en

  # Mermaid diagrams render via Material's native integration — see
  # markdown_extensions -> pymdownx.superfences custom_fences below. No
  # separate plugin is needed. mkdocs-mermaid2-plugin is deliberately NOT
  # used here: per Material's own docs
  # (https://squidfunk.github.io/mkdocs-material/reference/diagrams/), it
  # cannot be used together with the minify plugin below and doesn't adapt
  # to dark mode, which this site's palette toggle relies on.

  - redirects

  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
      type: datetime

  - minify:
      minify_html: true
      minify_css: true
      minify_js: true

  # Social preview cards (Open Graph / Twitter Card images), auto-generated
  # per page from its title/description at build time.
  #
  # NOT enabled here by default — this is a heavier dependency
  # (mkdocs-material[imaging], which pulls in Pillow and CairoSVG; CairoSVG
  # in turn needs the system libcairo2 library) and a separate concern from
  # the landing-page work in this change. Adding it is a one-block addition
  # once confirmed:
  #
  #   - social:
  #       cards_layout_options:
  #           background_color: "#1F2937"   # --baobab-primary
  #           color: "#FFFFFF"
  #
  # See pyproject.toml's `docs` dependency group for the matching install
  # change, and confirm the GitHub Actions runner has libcairo2 available
  # (ubuntu-latest ships it; self-hosted runners may not) before enabling.

# ------------------------------------------------------------------------------
# Additional Assets
# ------------------------------------------------------------------------------

extra_css:
  - assets/stylesheets/extra.css

# Custom JavaScript is introduced.
#
extra_javascript:
  - assets/javascripts/extra.js

# ------------------------------------------------------------------------------
# Extra Configuration
# ------------------------------------------------------------------------------

extra:

  # Hide the default "Made with Material for MkDocs" footer.
  generator: false

  social:

    - icon: fontawesome/brands/github
      link: https://github.com/nabhold

# ------------------------------------------------------------------------------
# Navigation
# ------------------------------------------------------------------------------

nav:

  - Home: index.md

  - Introduction:
      - Introduction: introduction/index.md
      - Overview: introduction/overview.md
      - Key Features: introduction/key-features.md
      - Supported Platforms: introduction/supported-platforms.md
      - What's Included: introduction/included.md
      - What's Not Included: introduction/excluded.md

  - Architecture:
      - Architecture: architecture/index.md
      - Repository Structure: architecture/repository-structure.md
      - Design Principles: architecture/design-principles.md
      - Version Management: architecture/version-management.md
      - Image Architecture: architecture/image-architecture.md
      - Toolchain: architecture/toolchain.md
      - Build Process: architecture/build-process.md

  - Usage:
      - Usage: usage/index.md
      - Running Locally: usage/running-locally.md
      - GitHub Codespaces: usage/github-codespaces.md
      - VS Code Dev Containers: usage/vscode-devcontainers.md

  - Reference:
      - Reference: reference/index.md
      - Build Arguments: reference/build-arguments.md
      - Environment Variables: reference/environment-variables.md
      - Helper Commands: reference/helper-commands.md
      - Build Verification: reference/build-verification.md
      - Health Checks: reference/health-checks.md

  - Project:
      - Project: project/index.md
      - Security: project/security.md
      - Contributing: project/contributing.md
      - Roadmap: project/roadmap.md
      - License: project/license.md
      - Copyright: project/copyright.md
      - Authors: project/authors.md
      - Contributors: project/contributors.md
      - Code of Conduct: project/code-of-conduct.md


  - Appendix:
      - Appendix: appendix/index.md
      - FAQ: appendix/faq.md
      - Glossary: appendix/glossary.md
      - Common Commands: appendix/common-commands.md
      - External References: appendix/external-references.md
      - Support: appendix/support.md
      - Acknowledgements: appendix/acknowledgements.md

# ------------------------------------------------------------------------------
# Validation
# ------------------------------------------------------------------------------

validation:

  omitted_files: warn

  absolute_links: warn

  unrecognized_links: warn

  anchors: warn

